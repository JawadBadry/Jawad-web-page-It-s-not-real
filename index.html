<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawad web page</title>
    <style>
        /* ألوان وتصميم مودرن ومريح للعين */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* كرت بروفايل احترافي */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* تأثير ضوئي خلف الكرت */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .title {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .bio {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* أزرار تفاعلية */
        .btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--accent-color);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.1);
        }

        .btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        /* لوحة التحكم السرية للمقالب */
        .secret-panel {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--text-muted);
            text-align: right;
        }

        .secret-panel label {
            font-size: 12px;
            color: var(--accent-color);
            display: block;
            margin-top: 10px;
        }

        .secret-panel input, .secret-panel textarea {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--text-muted);
            border-radius: 5px;
            color: #fff;
            margin-top: 5px;
            font-size: 13px;
        }

        /* زر سري جداً زاوية الصفحة */
        .secret-trigger {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            cursor: pointer;
            opacity: 0.1;
        }
        .secret-trigger:hover { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <!-- يمكنك وضع رابط صورتك هنا، حالياً وضعت صورة افتراضية رائعة -->
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" alt="Avatar" class="avatar" id="user-img">
        </div>
        
        <h1 id="user-name">جواد البدري</h1>
        <div class="title" id="user-title">مطور ويب محترف وعبقري برمجيات</div>
        <p class="bio" id="user-bio">أهلاً بك في موقعي الشخصي! أنا مبرمج شغوف بتعلم التقنيات الحديثة وبناء واجهات مستخدم مذهلة وتفاعلية باستخدام أحدث التقنيات مثل HTML5, CSS3, و JavaScript المتطورة.</p>
        
        <button class="btn" onclick="celebrate()">اضغط لمفاجأة عمي!</button>

        <!-- لوحة التحكم السرية اللي ما يشوفها إلا أنت -->
        <div class="secret-panel" id="secret-div">
            <h4 style="color: #ef4444; text-align:center;">لوحة التحكم السرية 🥷</h4>
            
            <label>الاسم:</label>
            <input type="text" id="edit-name" value="جواد البدري" oninput="updateProfile()">
            
            <label>اللقب البرمجي:</label>
            <input type="text" id="edit-title" value="مطور ويب محترف وعبقري برمجيات" oninput="updateProfile()">
            
            <label>الوصف (البيو):</label>
            <textarea id="edit-bio" rows="3" oninput="updateProfile()">أهلاً بك في موقعي الشخصي! أنا مبرمج شغوف بتعلم التقنيات الحديثة وبناء واجهات مستخدم مذهلة وتفاعلية باستخدام أحدث التقنيات مثل HTML5, CSS3, و JavaScript المتطورة.</textarea>
            
            <label>رابط صورة جديدة (اختياري):</label>
            <input type="text" id="edit-img" placeholder="ضع رابط الصورة هنا" oninput="updateProfile()">
        </div>

        <!-- زر مخفي بالزاوية لتشغيل اللوحة -->
        <div class="secret-trigger" onclick="toggleSecretPanel()"></div>
    </div>

    <!-- تأثيرات الـ JavaScript التفاعلية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // تأثير الاحتفال (القصاصات الملونة المبهجة) عند ضغط الزر
        function celebrate() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // إظهار وإخفاء لوحة التحكم السرية
        function toggleSecretPanel() {
            const panel = document.getElementById('secret-div');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // تحديث البيانات مباشرة على الشاشة فوراً عند الكتابة في اللوحة السرية
        function updateProfile() {
            document.getElementById('user-name').innerText = document.getElementById('edit-name').value;
            document.getElementById('user-title').innerText = document.getElementById('edit-title').value;
            document.getElementById('user-bio').innerText = document.getElementById('edit-bio').value;
            
            const imgUrl = document.getElementById('edit-img').value;
            if(imgUrl.trim() !== "") {
                document.getElementById('user-img').src = imgUrl;
            }
        }
    </script>
</body>
</html>
